[project]
name = "ai-research-orchestrator"
version = "0.1.0"
description = "Autonomous multi-agent research system"
authors = [
    {name = "Hackathon Team"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.0.0",
    "langgraph>=0.2.14",
    "langchain-google-genai>=2.0.0",
    "google-genai>=0.1.2",
    "tavily-python>=0.5.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "structlog>=24.0.0",
    "python-dotenv>=1.0.0",
    "aiosqlite>=0.20.0",
    "qdrant-client>=1.11.0",
    "fastembed>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
